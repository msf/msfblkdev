# Disposable Debian 13 test VM for `make vm-setup` and `make vm-test`.
# Lima uses VZ on macOS and QEMU with KVM on Linux. No host directory is mounted:
# scripts/vm.sh copies the repository into the guest and copies results back.
minimumLimaVersion: "2.0.0"

# Dated generic images (full kernel with ublk_drv and xfs modules). Digests are from
# https://cloud.debian.org/images/cloud/trixie/20261116-2664/SHA512SUMS, read 2026-11-26.
images:
- location: "https://cloud.debian.org/images/cloud/trixie/20261116-2664/debian-13-generic-amd64-20261116-2664.qcow2"
  arch: "x86_64"
  digest: "sha512:e53a93ef33f828ceed0e7278c2cc2753bdc7d5098fbfae15bd64b6d878db350ea3744247763a1c8ecb6b4019a0f623c38caf6038ad6f9c357fb4e01493ddf1a3"
- location: "https://cloud.debian.org/images/cloud/trixie/20261116-2664/debian-13-generic-arm64-20261116-2664.qcow2"
  arch: "aarch64"
  digest: "sha512:3d4655799e64ca93f51832da31101188f28e01cb14fec2164ac9a7a5f70f303b80f72e9632498dd9cb0099ad04b12c186bffe4f0cd50c5e739faa3ee85007eb0"

cpus: 4
memory: "6GiB"
disk: "30GiB"
mounts: []
containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    # A tmpfs /tmp defaults to half of RAM. The XFS preflight needs 4 GiB free for its sparse
    # backing ceiling; the tests write far less, so raise only the limit.
    if [ "$(findmnt -n -o FSTYPE /tmp)" = tmpfs ]; then
      mkdir -p /etc/systemd/system/tmp.mount.d
      printf '[Mount]\nOptions=mode=1777,strictatime,nosuid,nodev,size=12G\n' \
        > /etc/systemd/system/tmp.mount.d/size.conf
      systemctl daemon-reload
      mount -o remount,size=12G /tmp
    fi
