[package]
name = "block-storage"
version = "0.0.0"
edition = "2024"

[features]
test-failpoints = []
lab = ["dep:serde_json"]

[[bin]]
name = "block-storage-lab"
path = "src/bin/block-storage-lab/main.rs"
required-features = ["lab"]

[dependencies]
io-uring = "=0.7.16"
libc = "=0.2.191"
libublk = "=0.4.8"
serde_json = { version = "=1.0.154", optional = true, features = ["float_roundtrip"] }
xxhash-rust = { version = "=0.8.21", features = ["xxh3"] }

hashbrown = { version = "=0.17.1", default-features = false }

# Release code with line tables for perf. Build it with RUSTFLAGS="-C force-frame-pointers=yes"
# (see the Makefile's bench-aged-sqlite target) so that `perf record --call-graph fp` can unwind.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
