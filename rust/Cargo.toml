[package]
name = "block-storage"
version = "0.0.0"
edition = "2024"

[features]
test-failpoints = []
lab = ["dep:serde_json"]

[[bin]]
name = "block-storage-lab"
path = "src/bin/block-storage-lab/main.rs"
required-features = ["lab"]

[dependencies]
io-uring = "=0.7.14"
libc = "=0.2.186"
libublk = "=0.4.7"
serde_json = { version = "=1.0.151", optional = true, features = ["float_roundtrip"] }
xxhash-rust = { version = "=0.8.16", features = ["xxh3"] }

hashbrown = { version = "=0.17.1", default-features = false }
